<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fitness · SimonsMind</title>
  <meta name="theme-color" content="#2e3440">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="prompt" href="https://simonsmind.com"><span class="tilde">~/</span>SimonsMind<span class="path">/fitness</span><span class="cursor">_</span></a>
    <span id="rest" class="rest" hidden></span>
  </header>
  <main id="app"><p class="muted center">loading…</p></main>
  <nav id="tabs" class="tabs" hidden>
    <button data-tab="log">log</button>
    <button data-tab="history">history</button>
    <button data-tab="stats">stats</button>
  </nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="tip" class="tip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
